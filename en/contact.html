        <!--contenu-->
        <main>

            <!--contact-->
            <section class="contact section-padding" id="contact">
                <div class="container">
                    <div class="row justify-content-center">
                        
                        <div class="clearfix"></div>

                        <!--infosg-->
                        <div class="col-lg-3 col-12 pe-lg-0">
                            <div class="contact-info contact-info-border-start d-flex flex-column">
                                <h4>Contact details</h4>

                                <div class="contact-info-sections d-flex">
                                    <div class="contact-info-section">
                                        <strong class="site-footer-title d-block mb-3" style="margin-top:40px">My networks</strong>
                                        <ul class="social-icon">
                                            <li class="social-icon-item"><a href="https://www.linkedin.com/in/sullybck" class="social-icon-link bi-linkedin" target="_blank"></a></li>
                                            <li class="social-icon-item"><a href="https://github.com/SullyBck" class="social-icon-link bi-github" target="_blank"></a></li>
                                        </ul>
                                    </div>

                                    <div class="contact-info-section">
                                        <strong class="site-footer-title d-block mb-3" style="margin-top:40px">My email address</strong>
                                        <strong class="mb-3">
                                            <p>
                                                <a>
                                                    <script type="text/javascript">
                                                        var user = "sullyvan";
                                                        var domain = "buckwell";
                                                        var extension = "fr";
                                                        var emailAddress = user + "@" + domain + "." + extension;
                                                        var encodedEmail = '';
                                                        for (var i = 0; i < emailAddress.length; i++) {
                                                            encodedEmail += "&#" + emailAddress.charCodeAt(i) + ";";
                                                        }
                                                        document.write(encodedEmail);
                                                    </script>
                                                </a>
                                            </p>
                                        </strong>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!--formulaire-->
                        <div class="col-lg-7 col-12 mt-5 mt-lg-0">
                            <div class="contact section-title-wrap d-flex justify-content-center align-items-center mb-3">
                                <h2 class="text-white ms-4 mb-0">Contact form</h2>
                            </div>
                            <form action="https://formspree.io/f/mgebkjvb" method="post" class="custom-form contact-form">
                                <div class="row">
                                    <div class="col-lg-6 col-md-6 col-12">
                                        <div class="form-floating">
                                            <input type="text" name="name" id="name" class="form-control" placeholder="Name" required="">
                                            <label for="name">Your name</label>
                                        </div>
                                    </div>

                                    <div class="col-lg-6 col-md-6 col-12"> 
                                        <div class="form-floating">
                                            <input type="email" name="email" id="email" pattern="[^ @]*@[^ @]*" class="form-control" placeholder="Email address" required="">
                                            <label for="email">Your email address</label>
                                        </div>
                                    </div>

                                    <div class="col-lg-3 col-md-6 col-6">
                                        <div class="form-check form-check-inline">
                                            <input name="cours" type="checkbox" class="form-check-input" id="inlineCheckbox3" value="1">

                                            <label class="form-check-label" for="inlineCheckbox3">
                                                <i class="fa-solid fa-graduation-cap" style="font-size:30px; margin-top:30px; vertical-align:bottom; margin-bottom:-10px;"></i>
                                                <br><span class="form-check-label-text">Tutoring</span>
                                            </label>
                                        </div>
                                    </div>

                                    <div class="col-lg-3 col-md-6 col-6">
                                        <div class="form-check form-check-inline">
                                            <input name="video" type="checkbox" class="form-check-input" id="inlineCheckbox2" value="1">

                                            <label class="form-check-label" for="inlineCheckbox2">
                                                <i class="fa2 fa-solid fa-film" style="font-size:30px; margin-top:30px; vertical-align:bottom; margin-bottom:-10px;"></i>
                                                <br><span class="form-check-label-text">Video</span>
                                            </label>
                                        </div>
                                    </div>

                                    <div class="col-lg-3 col-md-6 col-6">
                                        <div class="form-check form-check-inline">
                                            <input name="aide_pc" type="checkbox" class="form-check-input" id="inlineCheckbox1" value="1">

                                            <label class="form-check-label" for="inlineCheckbox1">
                                                <i class="fa-solid fa-power-off" style="font-size:30px; margin-top:30px; vertical-align:bottom; margin-bottom:-10px;"></i>
                                                <br><span class="form-check-label-text">PC help</span>
                                            </label>
                                      </div>
                                    </div>

                                    <div class="col-lg-3 col-md-6 col-6">
                                        <div class="form-check form-check-inline me-0">
                                            <input name="programmation" type="checkbox" class="form-check-input" id="inlineCheckbox4" value="1">

                                            <label class="form-check-label" for="inlineCheckbox4">
                                                <i class="fa-solid fa-globe" style="font-size:30px; margin-top:30px; vertical-align:bottom; margin-bottom:-10px;"></i>
                                                <br><span class="form-check-label-text">Programming</span>
                                            </label>
                                        </div>
                                    </div>

                                    <div class="col-lg-12 col-12">
                                        <div class="form-floating">
                                            <textarea class="form-control" id="message" name="message" placeholder="Tell me about your project" style="resize: none;"></textarea>
                                            
                                            <label for="message">Write to me right here</label>
                                        </div>
                                    </div>

                                    <div class="col-lg-3 col-12 ms-auto">
                                        <button type="submit" class="form-control">Send</button>
                                    </div>

                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </section>

        </main>
